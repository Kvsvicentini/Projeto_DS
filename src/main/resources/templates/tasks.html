<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Minhas Tarefas</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}" /> 
</head>
<body>
    <header style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Gerenciador de Tarefas</h1>
        <div>
            <button id="theme-toggle" style="margin-right: 10px; padding: 8px; cursor: pointer;">
                </button>
            <form th:action="@{/logout}" method="post" style="display: inline;">
                <button type="submit">Sair</button>
            </form>
        </div>
    </header>

    <div th:if="${message}" style="border: 1px solid; padding: 10px; margin-bottom: 15px;">
        <span th:text="${message}"></span>
    </div>

    <a th:href="@{/tasks/form}">+ Nova Tarefa</a>

    <hr>
    
    <table>
        <thead>
            <tr>
                <th>Título</th>
                <th>Descrição</th>
                <th>Score</th>
                <th>Status (%)</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="task : ${tasks}">
                <td th:text="${task.title}"></td>
                <td th:text="${task.description}"></td>
                <td th:text="${task.score}"></td>
                <td th:text="${task.status}"></td>
                <td>
                    <a th:href="@{/tasks/edit/{id}(id=${task.id})}">Editar</a> 
                    | 
                    <a th:href="@{/tasks/delete/{id}(id=${task.id})}" onclick="return confirm('Tem certeza?');">Excluir</a>
                </td>
            </tr>
        </tbody>
    </table>

    <p th:if="${tasks.isEmpty()}">Nenhuma tarefa cadastrada ainda.</p>

    <script th:src="@{/js/theme-switcher.js}"></script>
</body>
</html>
