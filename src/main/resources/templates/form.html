<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro/Edição de Tarefa</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}" /> 
</head>
<body>
    <header style="display: flex; justify-content: space-between; align-items: center;">
        <h2 th:text="${task.id == null} ? 'Nova Tarefa' : 'Editar Tarefa'"></h2>
        <button id="theme-toggle" style="padding: 8px; cursor: pointer;"></button>
    </header>
    
    <form th:action="@{/tasks}" th:object="${task}" method="post">
        
        <input type="hidden" th:field="*{id}">
        
        <div>
            <label>Título:</label>
            <input type="text" th:field="*{title}" required>
            <p th:if="${#fields.hasErrors('title')}" th:errors="*{title}" style="color: red;"></p>
        </div>

        <div>
            <label>Descrição:</label>
            <textarea th:field="*{description}" required></textarea>
            <p th:if="${#fields.hasErrors('description')}" th:errors="*{description}" style="color: red;"></p>
        </div>
        
        <div>
            <label>Score (Pontuação):</label>
            <input type="number" th:field="*{score}">
            <p th:if="${#fields.hasErrors('score')}" th:errors="*{score}" style="color: red;"></p>
        </div>

        <div>
            <label>Status (0-100%):</label>
            <input type="number" th:field="*{status}">
            <p th:if="${#fields.hasErrors('status')}" th:errors="*{status}" style="color: red;"></p>
        </div>
        
        <button type="submit" th:text="${task.id == null} ? 'Criar Tarefa' : 'Salvar Alterações'"></button>
    </form>

    <a th:href="@{/tasks}">Voltar para a lista</a>
    
    <script th:src="@{/js/theme-switcher.js}"></script>
</body>
</html>
