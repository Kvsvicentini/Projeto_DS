<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gerencia KVS</title>
    <link rel="stylesheet" th:href="@{/css/theme.css}" /> 
</head>
<body>
    <header style="text-align: center; padding: 20px;">
        <h1>🚀 Gerencia KVS</h1>
        <p>Sua plataforma para organizar e monitorar suas atividades diárias com segurança.</p>
        
        <button id="theme-toggle" style="margin: 10px; padding: 8px; cursor: pointer;">Mude o tema para escuro</button>
    </header>

    <main style="text-align: center; padding: 50px;">
        <h2>Acesse sua conta para começar!</h2>
        
        <a th:href="@{/auth/login}" style="padding: 15px 30px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; font-size: 1.2em;">
            IR PARA O LOGIN
        </a>
        
        <p style="margin-top: 20px;">Não tem conta? <a th:href="@{/auth/register}">Registre-se agora</a>.</p>
    </main>
    
    <script th:src="@{/js/theme-switcher.js}"></script>
</body>
</html>
